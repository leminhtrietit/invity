name: Retention maintenance

on:
  schedule:
    - cron: "17 18 * * *" # 01:17 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run database retention and media cleanup
        run: node scripts/run-retention-maintenance.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEDIA_WORKER_SECRET: ${{ secrets.MEDIA_WORKER_SECRET }}
