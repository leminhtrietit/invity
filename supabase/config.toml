project_id = "invite"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://invity-ten.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://invity-ten.vercel.app/auth/callback",
]
enable_signup = true

[auth.email]
enable_signup = false
enable_confirmations = true

[auth.external.google]
enabled = false
# Enable and supply these values after creating the Google OAuth client.
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""

[functions.media-worker]
verify_jwt = false
